# Cyclo Arena inference configuration
# ====================================
#
# Run this file from the Cyclo Lab host checkout with:
#
#   ./scripts/arena/run.sh
#
# The three required selections are `robot`, `scene`, and `model`. Robot and
# scene use Cyclo Arena IDs; model points directly to a downloaded checkpoint.
# Inspect the current choices at any time with:
#
#   ./scripts/arena/run.sh --list-robots
#   ./scripts/arena/run.sh --list-scenes
#   ./scripts/arena/run.sh --list-models
#   ./scripts/arena/run.sh --list-poses
#   ./scripts/arena/run.sh --list-model-adapters
#   ./scripts/arena/run.sh list profiles
#   ./scripts/arena/run.sh list workflows

schema_version: 1

# 1. Robot
# --------
# A registered Cyclo robot ID. The robot entry selects the USD/articulation,
# sensors, actuators, and Arena runtime adapter from Cyclo Lab.
#
# Available now:
#   ffw_sg2  - ROBOTIS FFW-SG2 dual-arm mobile manipulator
robot:
  name: ffw_sg2

  # Optional Arena embodiment override. Omit it to use the robot/model default.
  # Available now:
  #   ffw_sg2_abs_joint_pos         - 19 joint-position actions
  #   ffw_sg2_mobile_abs_joint_pos  - 19 joint + [vx, vy, wz] actions
  # embodiment: ffw_sg2_abs_joint_pos

  # A named joint pose stored under configs/robots/<robot>/poses. It is separate
  # from the checkpoint so downloading a model never requires Python changes.
  # Available now: recycling, cartoning, showroom
  initial_pose: showroom

  # Optional joint overrides applied after `initial_pose`.
  # head_position order: [head_joint1, head_joint2], unit: radians.
  # lift_position unit: meters, valid FFW-SG2 range: [-0.5, 0.0].
  # head_position: [0.5, 0.0]
  # lift_position: -0.2

# 2. Scene
# --------
# A registered background/scene ID. It also supplies this robot's default base
# position and orientation. Available now:
#
#   galileo                         - Galileo warehouse
#   robotis_showroom                - local ROBOTIS showroom
#   robotis_showroom_training       - model-training showroom + products
#   simple_warehouse                - Isaac Sim warehouse
#   kitchen                         - Arena kitchen
#   kitchen_with_open_drawer        - Arena kitchen with an open drawer
#   lightwheel_robocasa_kitchen     - Lightwheel RoboCasa kitchen
#   packing_table                   - packing-table workstation
#   table                           - Seattle Lab table
#   office_table_background         - office table
#   maple_table_robolab             - Robolab maple table
#   table_oak_robolab               - Robolab oak table
scene:
  name: robotis_showroom_training

  # Optional robot base-pose overrides. Omit either value to use the selected
  # scene's FFW-SG2 placement registered in catalog.py.
  # robot_position_xyz unit: meters in the scene/world frame.
  # robot_yaw unit: radians around +Z; -1.57079632679 is -90 degrees.
  # robot_position_xyz: [-0.0955, -1.107, 0.0]
  # robot_yaw: -1.78

  # Optional scene-specific constructor values. These two options are used only
  # by lightwheel_robocasa_kitchen and default to 1 when omitted.
  # options:
  #   kitchen_layout: 1
  #   kitchen_style: 1

# Complete Lightwheel RoboCasa selection example:
#
# scene:
#   name: lightwheel_robocasa_kitchen
#   options:
#     kitchen_layout: 1
#     kitchen_style: 1

# 3. Inference model
# ------------------
# `checkpoint` uses CYCLO_ARENA_MODEL_ROOT so the same config works on the host
# and in Docker. The launcher maps it as follows:
#
#   host:      <cyclo_lab>/docker/workspace/model
#   container: /workspace/model
#
# `adapter: auto` reads config.json and processor_config.json from the checkpoint,
# then verifies its camera/state/action/language schema against the selected robot.
# `Gr00tN1d7` selects the pinned N1.7 runtime. Other model types are rejected
# before Docker startup. `./docker/container.sh start-groot` builds that image.
# No catalog.py edit is needed when another compatible checkpoint is downloaded.
# Inference transport and action chunk scheduling use the checked-out Arena
# ActionChunkingClientSidePolicy/PolicyServer implementation directly. Cyclo only
# selects the robot data adapter required by the checkpoint schema.
#
# N1.7 showroom example:
#   checkpoint: ${CYCLO_ARENA_MODEL_ROOT}/showroom_groot
#   robot.initial_pose: showroom
#
# The generic NVIDIA N1.7 base checkpoint does not contain the FFW-SG2
# `new_embodiment` schema. Cyclo Arena currently auto-detects both the
# single-head-camera joint-only schema and the three-camera showroom schema
# with arm_left/arm_right/odometry state and action keys.
model:
  checkpoint: ${CYCLO_ARENA_MODEL_ROOT}/showroom_groot

  # `auto` is recommended. Explicit values are useful only for debugging:
  #   ffw_sg2_gr00t_n17
  #   ffw_sg2_gr00t_n17_showroom
  adapter: auto

# Alternative direct-policy mode
# ------------------------------
# `model` and `policy` cannot be present together. A model selects its compatible
# policy automatically. To run without a model, remove/comment the `model` block
# above and enable a policy block such as:
#
# policy:
#   type: zero_action
#   # Optional settings for policies backed by an already running remote server:
#   remote_host: 127.0.0.1
#   remote_port: 5555
#   remote_timeout_ms: 120000

# Language instruction
# --------------------
# `name: scene_only` means this run has no success predicate or benchmark metric
# yet. `description` is still sent to the selected GR00T model as its instruction.
task:
  name: scene_only
  # Exact language label used by Dongkkka/showroom_groot during training.
  description: Cyclo-Real-Showroom-FFW-SG2-v0

# Simulation runtime
# ------------------
# `num_steps` and `num_episodes` are mutually exclusive. If both are omitted,
# the launcher uses 1800 steps. Model inference normally uses `num_steps`.
runtime:
  # Maximum policy/environment steps before the run closes.
  num_steps: 10000

  # Alternatively, stop after this many completed episodes. Do not use together
  # with num_steps. scene_only currently has no episode termination predicate.
  # num_episodes: 10

  # Number of parallel environments. Remote GR00T testing normally uses 1.
  num_envs: 1

  # Optional Isaac Lab simulation device. Omit it for AppLauncher auto-selection.
  # device: cuda:0

  # Optional deterministic environment seed. Omit it for an unseeded run.
  # seed: 42

  # Learned vision policies require cameras. A compatible model enables this by
  # default, but keeping the value explicit makes the experiment self-documenting.
  enable_cameras: true

  # false: open the Isaac Sim window. true: render without a visible window.
  headless: false

# Command-line overrides
# ----------------------
# Any commonly changed value can be overridden for one run without editing this
# file, for example:
#
#   ./scripts/arena/run.sh --scene kitchen --num-steps 100 --headless
#   ./scripts/arena/run.sh --robot-position-xyz 0.0 0.0 0.0 --robot-yaw -1.5708
#   ./scripts/arena/run.sh --head-position 0.5 0.0 --lift-position -0.2
#
# Run `cyclo-arena infer --help` inside the container for the complete CLI override
# list. Explicit CLI values take precedence over this file.
